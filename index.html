<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Policy Attestation Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:120px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📝 Policy Attestation Tracker</h1><p>Estimate campaign completion and reminder load.</p><label>Employees: <input id="e" type="number" value="250"></label> <label>Policies per employee: <input id="p" type="number" value="4"></label> <label>Expected initial completion (%): <input id="c" type="number" value="60"></label> <button onclick="go()">Simulate campaign</button><div id="out"></div><script>function go(){const e=+document.getElementById('e').value,p=+document.getElementById('p').value,c=+document.getElementById('c').value/100;const total=e*p,done=Math.round(total*c),open=total-done;document.getElementById('out').textContent=`Total attestations: ${total}\nCompleted first pass: ${done}\nOutstanding: ${open}\nReminder sequence: +3d email, +7d manager CC, +14d escalation → est. +${Math.round(open*0.75)} completions\nFinal projected compliance: ${Math.round((done+open*0.75)/total*100)}%\n\nAutomated campaigns with audit evidence: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/policy-attestation-tracker">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-compliance-monitor/">Compliance Monitor</a></p></body></html>
