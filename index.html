<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Policy Attestation Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:120px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>✅ Policy Attestation Tracker</h1><p>Estimate campaign completion and escalation needs.</p><label>Employees: <input id="e" type="number" value="250"></label> <label>Attested so far: <input id="a" type="number" value="140"></label> <label>Days to deadline: <input id="d" type="number" value="10"></label> <button onclick="go()">Analyze</button><div id="out"></div><script>function go(){const g=id=>+document.getElementById(id).value;const e=g('e'),a=g('a'),d=g('d');const pct=Math.round(a/e*100),rate=a/Math.max(1,(30-d)),need=(e-a)/Math.max(1,d);document.getElementById('out').textContent=`Completion: ${pct}% (${a}/${e})\nRequired pace: ${need.toFixed(1)} attestations/day vs current ${rate.toFixed(1)}/day\n${need>rate?'🔴 Behind pace — trigger reminder escalation + manager nudge':'🟢 On track'}\n\nAutomated attestation campaigns: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/policy-attestation-tracker">GitHub</a> · <a href="https://ziontechgroup.com/regulatory-change-radar/">Regulatory Radar</a></p></body></html>
